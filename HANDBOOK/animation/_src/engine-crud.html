<title>{{TITLE}}</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    color-scheme: dark;
    --page:#0b1826; --stage:#10263a; --card:#16324a; --line:#2a4d6b;
    --ink:#eef3f7; --mut:#9db3c6; --gold:#f4b942; --teal:#39c0c8; --pink:#ef8fc6;
    --coral:#ff8a5b; --violet:#a996ff; --red:#ff5d6c; --green:#5ad18a;
    --sans:'Noto Sans TC','Microsoft JhengHei','PingFang TC',system-ui,sans-serif;
    --mono:'JetBrains Mono',Consolas,'Courier New',monospace;
  }
  *{box-sizing:border-box}
  html,body{background:var(--page);color:var(--ink)}
  body{font-family:var(--sans);font-size:18px;line-height:1.6;margin:0}
  .wrap{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:14px 48px}
  header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:10px}
  header.top h1{font-size:clamp(22px,2.4vw,32px);font-weight:900;margin:0;letter-spacing:.02em}
  header.top p{margin:0;color:var(--mut);font-size:16px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:thin}
  .chips button{flex:none;font:inherit;font-size:18px;font-weight:700;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer}
  .chips button[aria-current="true"]{color:#10263a;background:var(--gold);border-color:var(--gold)}
  /* 兩層章節：上排 Step、下排該 Step 的段落 */
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
  .steps button{font:inherit;text-align:left;color:var(--ink);background:var(--card);border:2px solid var(--line);border-top:6px solid var(--c);border-radius:12px;padding:6px 12px 8px;cursor:pointer;line-height:1.3}
  .steps button b{display:block;font-size:16px;font-weight:900;color:var(--c);letter-spacing:.03em}
  .steps button span{display:block;font-size:19px;font-weight:800}
  .steps button[aria-current="true"]{background:#233f59;border-color:var(--c)}
  .steps button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  .chips button:focus-visible,.ctrl button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  .stagebox{width:min(100%, calc((100vh - 230px) * 16 / 9));min-width:min(100%,640px);margin:0 auto;background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  #stage{display:block;width:100%;height:auto}
  .sub{width:min(100%, calc((100vh - 230px) * 16 / 9));min-width:min(100%,640px);margin:10px auto 0;display:grid;gap:8px}
  .subline{min-height:3.2em;background:#050d16;border-radius:12px;padding:12px 20px;font-size:clamp(21px,2.3vw,32px);font-weight:700;line-height:1.5;text-wrap:pretty}
  /* 全螢幕（投影用）：舞台＋字幕＋控制列填滿螢幕 */
  .player:fullscreen{background:var(--page);padding:12px 16px;overflow:auto;display:flex;flex-direction:column;justify-content:center}
  .player:fullscreen .stagebox,.player:fullscreen .sub{width:min(100%, calc((100vh - 200px) * 16 / 9))}
  .player:fullscreen .subline{font-size:clamp(24px,2.4vw,40px)}
  .player:fullscreen .hint{display:none}
  .subline small{display:block;font-size:.55em;font-weight:700;color:var(--gold);letter-spacing:.06em;margin-bottom:2px}
  .bar{height:5px;background:var(--card);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--gold)}
  .ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
  .ctrl button{font:inherit;font-size:17px;font-weight:700;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;min-width:48px}
  .ctrl button.main{background:var(--gold);color:#10263a;border-color:var(--gold);min-width:120px}
  .ctrl select{font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:15em}
  .ctrl label{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:15px;font-weight:700}
  .ctrl select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  .ctrl button.off{color:var(--mut);text-decoration:line-through}
  .voicenote{color:var(--gold);font-size:15px;text-align:center;margin:0}
  .stagebox{position:relative}
  .startbtn{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);font:inherit;font-size:clamp(18px,2.2vw,28px);font-weight:900;color:#10263a;background:var(--gold);border:0;border-radius:999px;padding:.6em 1.4em;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.45)}
  .startbtn:focus-visible{outline:4px solid var(--teal);outline-offset:3px}
  .ctrl .pos{color:var(--mut);font-size:15px;font-variant-numeric:tabular-nums;min-width:9em;text-align:center}
  .hint{color:var(--mut);font-size:15px;text-align:center;margin:4px 0 0}
  section.after{max-width:1100px;margin:44px auto 0}
  section.after h2{font-size:26px;font-weight:900;margin:0 0 6px;text-wrap:balance}
  section.after > p{color:var(--mut);margin:0 0 16px;max-width:65ch}
  .roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .role{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:12px;padding:14px 16px}
  .role h3{margin:0 0 6px;font-size:20px;color:var(--c)}
  .role ul{margin:0;padding-left:1.2em;font-size:17px}
  .role .out{margin:10px 0 0;font-size:16px;font-weight:700;color:var(--ink);background:#0b1826;border-radius:8px;padding:6px 10px}
  .where{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:17px}
  .where code{font-family:var(--mono);font-size:15px;color:var(--gold);word-break:break-all}

  #stage text{font-family:var(--sans)}
  #stage .mono{font-family:var(--mono)}
  #stage g,#stage text,#stage path,#stage rect,#stage circle{transition:opacity .6s ease, transform 1.2s cubic-bezier(.45,0,.2,1)}
  #stage .hid{opacity:0}
  #stage.paused *{animation-play-state:paused!important}
  #stage .dim{opacity:.22}
  #stage .draw{stroke-dasharray:1 1;stroke-dashoffset:1;opacity:0;transition:stroke-dashoffset 1.1s ease, opacity .1s}
  #stage .draw.on{stroke-dashoffset:0;opacity:1}
  #stage .glow{animation:glow 1.3s ease-in-out 3}
  @keyframes glow{50%{filter:drop-shadow(0 0 8px #ffffff) drop-shadow(0 0 20px rgba(255,255,255,.55))}}
  #stage .stamp{transform-box:fill-box;transform-origin:center;transition:opacity .3s, transform .45s cubic-bezier(.2,1.5,.4,1)}
  #stage .stamp.hid{transform:scale(1.9)}
  #stage .ping{transform-box:fill-box;transform-origin:center;animation:ping 1.3s ease-out infinite}
  @keyframes ping{from{transform:scale(1);opacity:1}to{transform:scale(3.4);opacity:0}}
  #stage .tcursor{animation:tblink 1.1s steps(1) infinite}
  @keyframes tblink{50%{opacity:0}}
  #stage .mcur{transition:transform 1.1s cubic-bezier(.45,0,.2,1), opacity .4s}
  #stage.instant *{transition:none!important;animation:none!important}

  /* ---- 嵌入模式（被 iframe 嵌入，或網址帶 #embed）---- */
  html.embed header.top, html.embed section.after, html.embed .hint{display:none}
  html.embed .wrap{padding-block:6px 8px}
  html.embed .stagebox, html.embed .sub{width:min(100%, calc((100vh - 255px) * 16 / 9))}
  html.embed .subline{font-size:clamp(18px,2vw,26px);min-height:2.8em;padding:8px 16px}
  /* ---- 問小港側欄 ---- */
  .askbtn{font:inherit;font-size:16px;font-weight:800;color:#10263a;background:var(--teal);border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
  .askbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .askdrawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:#0e2133;border-left:1px solid var(--line);box-shadow:-10px 0 40px rgba(0,0,0,.45);display:flex;flex-direction:column;z-index:50;transform:translateX(105%);transition:transform .3s ease}
  .askdrawer.open{transform:none}
  .askhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .askhead h3{margin:0;font-size:20px;font-weight:900;flex:1}
  .askhead button{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer}
  .askwhere{font-size:14px;color:var(--gold);padding:8px 16px 0}
  .asklog{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
  .askmsg{border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
  .askmsg.me{align-self:flex-end;background:var(--gold);color:#10263a;font-weight:700;max-width:85%}
  .askmsg.bot{background:var(--card);border:1px solid var(--line)}
  .askmsg.wait{color:var(--mut)}
  .askjump{display:inline-block;margin:6px 6px 0 0;font:inherit;font-size:14px;font-weight:800;color:#10263a;background:var(--teal);border:0;border-radius:8px;padding:4px 10px;cursor:pointer;white-space:normal;text-align:left}
  .askform{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line)}
  .askform input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:#081522;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .askform button{font:inherit;font-weight:800;background:var(--gold);color:#10263a;border:0;border-radius:10px;padding:0 14px;cursor:pointer}
  .askform input:focus-visible{outline:3px solid var(--teal)}
  .asktips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}
  .asktips button{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
  @media (prefers-reduced-motion: reduce){
    #stage *{transition-duration:.01s!important;animation:none!important}
  }
  @media (max-width:640px){
    .stagebox,.sub{min-width:0;width:100%}
    .ctrl button{padding:8px 10px;font-size:15px}
  }
</style>

<div class="wrap">
  <header class="top">
    <h1>{{H1}}</h1>
    <p>{{SUBTITLE}}</p>
  </header>

  <nav class="steps" id="steps" aria-label="課程步驟" hidden></nav>
  <nav class="chips" id="chips" aria-label="章節"></nav>

  <div class="player" id="player">
  <div class="stagebox">
    <svg id="stage" viewBox="0 0 1600 900" role="img" aria-label="{{H1}}動畫畫面">
      <defs id="defs"></defs>
      <rect x="0" y="0" width="1600" height="900" fill="#10263a"></rect>
      <g id="layer"></g>
    </svg>
    <button id="bStart" class="startbtn" type="button">▶ 開始播放（有中文語音）</button>
  </div>

  <div class="sub">
    <div class="subline" id="subline" aria-live="polite"><small id="scenelabel">第 1 段</small><span id="subtext">載入中…</span></div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="ctrl">
      <button id="bPrevScene" type="button" title="上一段">⏮ 上一段</button>
      <button id="bPrev" type="button" title="上一句（←）">◀ 上一句</button>
      <button id="bPlay" type="button" class="main">▶ 播放</button>
      <button id="bNext" type="button" title="下一句（→）">下一句 ▶</button>
      <button id="bNextScene" type="button" title="下一段">下一段 ⏭</button>
      <button id="bVoice" type="button" title="開關語音">🔊 語音：開</button>
      <label for="voiceSel">聲音<select id="voiceSel"><option value="">預設中文</option></select></label>
      <label for="speedSel">速度<select id="speedSel"><option value="0.75">0.75×（慢）</option><option value="1" selected>1×（正常）</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×（快）</option></select></label>
      <button id="bAsk" type="button" class="askbtn" hidden>💬 問小港</button>
      <button id="bFull" type="button" title="全螢幕（F）">⛶ 全螢幕</button>
      <span class="pos" id="pos">1 段</span>
    </div>
    <p class="voicenote" id="voiceNote" hidden></p>
    <p class="hint">空白鍵：暫停／播放　·　← →：上一句／下一句　·　F：全螢幕　·　上面的 Step 和章節可以直接跳　·　速度同時調整語音和字幕</p>
  </div>
  </div>

<!--{{AFTER}}-->
</div>

<aside class="askdrawer" id="askDrawer" aria-label="問小港" aria-hidden="true">
  <div class="askhead"><h3>💬 問小港</h3><button type="button" id="askClose">關閉</button></div>
  <div class="askwhere" id="askWhere"></div>
  <div class="asklog" id="askLog" aria-live="polite"></div>
  <div class="asktips" id="askTips"></div>
  <form class="askform" id="askForm"><label for="askInput" class="sr" hidden>問題</label><input id="askInput" autocomplete="off" placeholder="看不懂的地方直接問，例如：五選一怎麼選？"><button type="submit">送出</button></form>
</aside>
<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const C={bg:'#10263a',ink:'#eef3f7',mut:'#9db3c6',card:'#16324a',card2:'#1c3d59',line:'#2a4d6b',
  gold:'#f4b942',teal:'#39c0c8',pink:'#ef8fc6',coral:'#ff8a5b',violet:'#a996ff',red:'#ff5d6c',green:'#5ad18a',grey:'#7f93a6',blue:'#9fb4ff'};
const svg=document.getElementById('stage'), layer=document.getElementById('layer'), defs=document.getElementById('defs');
let L=layer, instant=false, timers=[];

/* ---------- 繪圖小工具 ---------- */
function mk(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a){if(a[k]==null)continue;if(k==='text')e.textContent=a[k];else e.setAttribute(k,a[k]);}(p||L).appendChild(e);return e;}
function grp(p,hidden=true,cls=''){return mk('g',{class:((hidden?'hid ':'')+cls).trim()||null},p);}
function T(p,x,y,s,o={}){const size=o.size||34;const t=mk('text',{x,y,'font-size':size,fill:o.fill||C.ink,'text-anchor':o.anchor||'start','font-weight':o.weight||500,class:o.mono?'mono':null},p);String(s).split('\n').forEach((line,i)=>mk('tspan',{x,dy:i?size*1.3:0,text:line},t));return t;}
function R(p,x,y,w,h,o={}){return mk('rect',{x,y,width:w,height:h,rx:o.rx??14,fill:o.fill||C.card,stroke:o.stroke||'none','stroke-width':o.sw||3,'stroke-dasharray':o.dash||null},p);}
function P(p,d,color,o={}){return mk('path',{d,fill:'none',stroke:color,'stroke-width':o.w||6,'stroke-linecap':'round',pathLength:1,class:'draw'},p);}
function box(p,x,y,w,h,label,o={}){const g=grp(p,o.hidden!==false);R(g,x,y,w,h,o);const n=String(label).split('\n').length;const size=o.size||30;T(g,x+w/2,y+h/2-(n-1)*size*0.65+size*0.36,label,{size,anchor:'middle',fill:o.color||C.ink,weight:o.weight||700,mono:o.mono});return g;}
['gold','teal','pink','coral','violet','red','green','grey','mut','blue'].forEach(k=>{const m=mk('marker',{id:'ah-'+k,viewBox:'0 0 10 10',refX:6,refY:5,markerWidth:4,markerHeight:4,orient:'auto-start-reverse'},defs);mk('path',{d:'M0,0 L10,5 L0,10 z',fill:C[k]},m);});
function arrow(p,d,ck,o={}){const g=grp(p,o.hidden!==false);const w=o.w||5;
  if(o.dash)mk('path',{d,fill:'none',stroke:C[ck],'stroke-width':w,'stroke-dasharray':'12 10','stroke-linecap':'round'},g);else P(g,d,C[ck],{w});
  mk('path',{d,fill:'none',stroke:C[ck],'stroke-opacity':0,'stroke-width':w,'marker-end':`url(#ah-${ck})`,class:'hid late'},g);return g;}
function dot(p,x,y,color,label,o={}){const g=grp(p,o.hidden!==false);mk('circle',{cx:x,cy:y,r:o.r||16,fill:color,stroke:C.bg,'stroke-width':5},g);if(label)T(g,x,o.above?y-30:y+50,label,{size:o.size||22,anchor:'middle',fill:o.lf||C.mut,mono:o.mono!==false,weight:500});return g;}
function check(p,x,y,o={}){const g=grp(p,o.hidden!==false);mk('circle',{cx:x,cy:y,r:22,fill:C.green},g);T(g,x,y+11,'✓',{size:30,anchor:'middle',weight:900,fill:C.bg});return g;}
function stamp(p,cx,cy,text,color,o={}){const size=o.size||48;const g=grp(p,true,'stamp');const inner=mk('g',{transform:`rotate(${o.rot??-8} ${cx} ${cy})`},g);
  const lines=String(text).split('\n');const w=o.w||Math.max(...lines.map(l=>l.length))*size+70;const h=o.h||lines.length*size*1.3+34;
  R(inner,cx-w/2,cy-h/2,w,h,{fill:'rgba(5,13,22,.82)',stroke:color,sw:6,rx:10});T(inner,cx,cy-(lines.length-1)*size*0.65+size*0.36,text,{size,anchor:'middle',weight:900,fill:color});return g;}
function laneLabel(p,x,y,name,sub,color,right){const t=mk('text',{x,y,'text-anchor':right?'end':'start'},p);mk('tspan',{text:name,fill:color,'font-size':34,'font-weight':900},t);if(sub)mk('tspan',{text:'　'+sub,fill:C.mut,'font-size':24,'font-weight':500},t);return t;}
function lane(p,x1,x2,y,color,name,sub,o={}){const g=grp(p,o.hidden!==false);P(g,o.d||`M${x1},${y} H${x2}`,color,{w:10});if(name)laneLabel(g,o.right?x2:x1,y-28,name,sub,color,o.right);return g;}
function sideLane(p,d,y,color,name,sub){const g=grp(p);P(g,d,color,{w:10});T(g,70,y+4,name,{size:38,weight:900,fill:color,mono:true});T(g,70,y+38,sub,{size:22,fill:C.mut});return g;}
function head(eyebrow,title){T(L,70,78,eyebrow,{size:26,fill:C.coral,weight:700});T(L,70,134,title,{size:50,weight:900});}
function person(p,cx,cy,color,o={}){const g=grp(p,o.hidden!==false);mk('circle',{cx,cy:cy-40,r:26,fill:color},g);mk('path',{d:`M${cx-46},${cy+42} q0,-54 46,-54 q46,0 46,54 z`,fill:color},g);return g;}
function db(p,cx,cy,w,h,color){const g=grp(p,false);const rx=w/2,ry=w/7;mk('path',{d:`M${cx-rx},${cy-h/2} v${h} a${rx},${ry} 0 0 0 ${w},0 v${-h}`,fill:C.card2,stroke:color,'stroke-width':4},g);mk('ellipse',{cx,cy:cy-h/2,rx,ry,fill:C.card2,stroke:color,'stroke-width':4},g);mk('path',{d:`M${cx-rx},${cy} a${rx},${ry} 0 0 0 ${w},0`,fill:'none',stroke:color,'stroke-width':3},g);return g;}

/* ---------- 動作 ---------- */
/* later 的計時器可以暫停：暫停時記下剩多久，繼續播放時接著跑 */
function later(ms,fn){if(instant){fn();return;}const t={fn,due:performance.now()+ms/speed};t.id=setTimeout(()=>{timers=timers.filter(x=>x!==t);fn();},ms/speed);timers.push(t);}
let frozen=[];
function pauseTimers(){const now=performance.now();timers.forEach(t=>{clearTimeout(t.id);t.left=Math.max(0,t.due-now);});svg.classList.add('paused');
  try{frozen=(svg.getAnimations?svg.getAnimations({subtree:true}):document.getAnimations()).filter(a=>a.playState==='running');frozen.forEach(a=>a.pause());}catch(e){frozen=[];}}
function resumeTimers(){const now=performance.now();timers.forEach(t=>{if(t.left==null)return;t.due=now+t.left;t.id=setTimeout(()=>{timers=timers.filter(x=>x!==t);t.fn();},t.left);t.left=null;});svg.classList.remove('paused');frozen.forEach(a=>{try{if(a.playState==='paused')a.play();}catch(e){}});frozen=[];}
function show(x){if(!x)return;if(Array.isArray(x)){x.forEach(show);return;}x.classList.remove('hid');if(x.classList.contains('draw'))x.classList.add('on');x.querySelectorAll('.draw').forEach(d=>d.classList.add('on'));x.querySelectorAll('.late').forEach(d=>later(900,()=>d.classList.remove('hid')));}
function hide(x){if(Array.isArray(x)){x.forEach(hide);return;}x&&x.classList.add('hid');}
function dim(x,on=true){if(Array.isArray(x)){x.forEach(e=>dim(e,on));return;}x&&x.classList.toggle('dim',on);}
function glow(x){if(Array.isArray(x)){x.forEach(glow);return;}if(!x||instant)return;x.classList.remove('glow');void x.getBBox();x.classList.add('glow');}
function move(x,t){x.style.transform=t;}
function stagger(list,gap,fn=show){list.forEach((e,i)=>later(i*gap,()=>fn(e)));}

/*{{SCENES}}*/
/* ---------- 播放器 ---------- */
let cur=0,stepI=0,refs={},playing=false,timer=null,speed=1,stepStart=0,stepDur=1,remain=0,ended=false;
const $=id=>document.getElementById(id);
const ANIM_ID='{{ANIM_ID}}', ASK_URL='{{ASK_URL}}';
window.__animIndex=scenes.map((sc,i)=>({n:i+1,title:sc.title,steps:sc.steps.map(x=>x[0])}));
const chips=$('chips');
/* 兩層章節：有 chapter() 時，上排是 Step，下排只列目前 Step 的段落 */
const CH=(window.__chaps||[]);const stepsNav=$('steps');let chipShown=-2;
if(CH.length){stepsNav.hidden=false;CH.forEach((c,ci)=>{const b=document.createElement('button');b.type='button';b.style.setProperty('--c',c.color);
  b.innerHTML=`<b>${c.tag}</b><span>${c.title}</span>`;b.addEventListener('click',()=>{const i=scenes.findIndex(s=>s.chap===ci);if(i>=0){$('bStart').hidden=true;goto(i,0);}});stepsNav.appendChild(b);});}
scenes.forEach((s,i)=>{const b=document.createElement('button');b.type='button';
  const k=CH.length?scenes.slice(0,i+1).filter(x=>x.chap===s.chap).length:0;b.textContent=CH.length?`${k}. ${s.title}`:(i+1)+'. '+s.title;b.dataset.chap=s.chap;
  b.addEventListener('click',()=>{goto(i,0);});chips.appendChild(b);});
function syncNav(){if(!CH.length)return;const c=scenes[cur].chap;[...stepsNav.children].forEach((b,i)=>b.setAttribute('aria-current',i===c?'true':'false'));
  if(chipShown!==c){[...chips.children].forEach(b=>{b.hidden=+b.dataset.chap!==c;});chipShown=c;}}
$('bFull').addEventListener('click',()=>{const el=$('player');if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});});
function durOf(t){return Math.min(15000,Math.max(4200,t.length*250+1300))/speed;}
/* ---------- 語音 ---------- */
const synth=('speechSynthesis' in window)?window.speechSynthesis:null;let voiceOn=!!synth,voices=[],stepToken=0;
const CIRC='①②③④⑤⑥⑦⑧⑨⑩';
function spoken(t){(window.__spoken||[]).forEach(([re,s])=>{t=t.replace(re,s);});return t.replace(/[\u2460-\u2469]/g,c=>(CIRC.indexOf(c)+1)+' 號').replace(/!(\d+)/g,'$1 號').replace(/(\d+):(\d+)/g,'$1 比 $2').replace(/＝/g,'等於').replace(/・/g,' ').replace(/○○/g,'某某').replace(/～/g,'到').replace(/→/g,'到').replace(/＋/g,'加').replace(/／/g,'、').replace(/([A-Za-z0-9.\-]+)\/([A-Za-z0-9.\-]+)/g,'$1 $2').replace(/[「」（）]/g,' ');}
let CLOUD=false,curAudio=null;const audioCache=new Map();
const CLOUD_VOICES=[['zh-TW-HsiaoChenNeural','☁ 曉臻（女）'],['zh-TW-YunJheNeural','☁ 雲哲（男）'],['zh-TW-HsiaoYuNeural','☁ 曉雨（女）']];
function addCloudOptions(sel){if(!CLOUD)return;CLOUD_VOICES.slice().reverse().forEach(([id,label])=>{if([...sel.options].some(o=>o.value==='cloud:'+id))return;const o=document.createElement('option');o.value='cloud:'+id;o.textContent=label;sel.insertBefore(o,sel.firstChild);});}
function loadVoices(){if(!synth)return;const zh=synth.getVoices().filter(v=>/^(zh|cmn)/i.test(v.lang));
  const sc=v=>(/TW/i.test(v.lang)?100:/HK/i.test(v.lang)?30:50)+(/Natural|Online/i.test(v.name)?20:0)+(/Google/i.test(v.name)?5:0);zh.sort((a,b)=>sc(b)-sc(a));voices=zh;
  const sel=$('voiceSel'),prev=sel.value;sel.innerHTML='';
  if(!zh.length){sel.innerHTML='<option value="">預設中文</option>';}
  zh.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name.replace(/^Microsoft\s+/,'').replace(/\s*Online \(Natural\)/,'').replace(/\s*-\s*Chinese.*$/,'')+'（'+v.lang+'）';sel.appendChild(o);});
  addCloudOptions(sel);
  sel.value=[...sel.options].some(o=>o.value===prev)?prev:(sel.options[0]?sel.options[0].value:'');
  const note=$('voiceNote');if(!zh.length){note.textContent='這個瀏覽器找不到中文語音，會用預設聲音念；念不出來時字幕照常播放。建議用 Edge 或 Chrome。';note.hidden=false;}else note.hidden=true;}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices;}else{$('voiceNote').textContent='這個瀏覽器不支援語音，字幕照常播放。';$('voiceNote').hidden=false;$('bVoice').disabled=true;voiceOn=false;$('bVoice').textContent='🔇 無語音';}
function isCloud(){return CLOUD&&$('voiceSel').value.startsWith('cloud:');}
function stopAudio(){if(curAudio){curAudio.onended=null;curAudio.onerror=null;curAudio.pause();curAudio=null;}}
function ttsFetch(text,voice){const k=voice+'|'+text;if(audioCache.has(k))return audioCache.get(k);
  const p=fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:spoken(text),voice,rate:'0%'})})
    .then(r=>{if(!r.ok)throw new Error('tts '+r.status);return r.json();}).then(j=>'data:'+j.mime+';base64,'+j.audio);
  audioCache.set(k,p);p.catch(()=>audioCache.delete(k));return p;}
function nextText(){const sc=scenes[cur];if(stepI+1<sc.steps.length)return sc.steps[stepI+1][0];const n=scenes[cur+1];return n?n.steps[0][0]:null;}
function cloudSpeak(text,tok){const voice=$('voiceSel').value.slice(6);
  const next=ms=>{if(tok!==stepToken||!playing)return;clearTimeout(timer);timer=setTimeout(()=>{if(tok===stepToken)advance();},ms);};
  const fail=()=>next(Math.max(300,stepDur-(performance.now()-stepStart)));
  ttsFetch(text,voice).then(src=>{if(tok!==stepToken||!playing)return;stopAudio();curAudio=new Audio(src);curAudio.playbackRate=speed;
    curAudio.onended=()=>next(500/speed);curAudio.onerror=fail;curAudio.play().catch(fail);}).catch(fail);
  const nx=nextText();if(nx)ttsFetch(nx,voice).catch(()=>{});}
function speak(text,tok){if(isCloud()){cloudSpeak(text,tok);return;}if(!synth)return;synth.cancel();const u=new SpeechSynthesisUtterance(spoken(text));u.lang='zh-TW';const v=voices.find(x=>x.name===$('voiceSel').value);if(v){u.voice=v;u.lang=v.lang;}u.rate=speed;
  const next=ms=>{if(tok!==stepToken||!playing)return;clearTimeout(timer);timer=setTimeout(()=>{if(tok===stepToken)advance();},ms);};
  u.onend=()=>next(700/speed);
  u.onerror=e=>{if(e.error==='interrupted'||e.error==='canceled')return;next(Math.max(300,stepDur-(performance.now()-stepStart)));};
  setTimeout(()=>{if(tok===stepToken&&playing)synth.speak(u);},60);}
function startClock(){clearTimeout(timer);const tok=++stepToken;
  if(voiceOn&&(synth||isCloud())){speak(scenes[cur].steps[stepI][0],tok);timer=setTimeout(()=>{if(tok===stepToken)advance();},stepDur*2.5+5000);}
  else timer=setTimeout(()=>{if(tok===stepToken)advance();},Math.max(300,remain));}
function stopVoice(){stepToken++;if(synth)synth.cancel();stopAudio();}
function setSub(){const s=scenes[cur];const ch=CH[s.chap];$('scenelabel').textContent=ch?`${ch.tag}　${ch.title}　›　${s.title}`:`第 ${cur+1} 段　${s.title}`;$('subtext').textContent=s.steps[stepI][0];syncNav();
  $('pos').textContent=`${cur+1}／${scenes.length} 段　·　${stepI+1}／${s.steps.length} 句`;
  [...chips.children].forEach((b,i)=>b.setAttribute('aria-current',i===cur?'true':'false'));
  const act=chips.children[cur];if(act&&act.scrollIntoView)try{act.scrollIntoView({block:'nearest',inline:'nearest'});}catch(e){}
  try{history.replaceState(null,'','#s'+(cur+1)+'-'+(stepI+1));}catch(e){}
  try{if(window.parent!==window)window.parent.postMessage({type:'anim:state',anim:ANIM_ID,scene:cur+1,step:stepI+1,title:s.title,text:s.steps[stepI][0],total:scenes.length},'*');}catch(e){}
  const w=$('askWhere');if(w)w.textContent=`正在看：第 ${cur+1} 段　${s.title}`;}
let gotoTok=0;
function goto(i,s){clearTimeout(timer);stopVoice();timers.forEach(t=>clearTimeout(t.id));timers=[];frozen.forEach(a=>{try{a.finish();}catch(e){}});frozen=[];svg.classList.remove('paused');ended=false;cur=i;stepI=s;const gt=++gotoTok;
  instant=true;svg.classList.add('instant');layer.innerHTML='';L=layer;refs=scenes[i].build()||{};
  for(let k=0;k<s;k++)scenes[i].steps[k][1](refs);
  svg.getBoundingClientRect();
  requestAnimationFrame(()=>{if(gt!==gotoTok)return;svg.classList.remove('instant');instant=false;runStep(s);});}
function runStep(s){stepI=s;const st=scenes[cur].steps[s];st[1](refs);setSub();stepDur=durOf(st[0]);remain=stepDur;stepStart=performance.now();if(playing)startClock();}
function advance(){clearTimeout(timer);if(stepI+1<scenes[cur].steps.length)runStep(stepI+1);else if(cur+1<scenes.length)goto(cur+1,0);else{ended=true;setPlaying(false);$('bPlay').textContent='↺ 重播';}}
function back(){if(stepI>0)goto(cur,stepI-1);else if(cur>0)goto(cur-1,scenes[cur-1].steps.length-1);}
function setPlaying(p){clearTimeout(timer);if(p){$('bStart').hidden=true;}
  if(p&&!playing){playing=true;resumeTimers();if(voiceOn&&(synth||isCloud()))remain=stepDur;stepStart=performance.now()-(stepDur-remain);startClock();$('bPlay').textContent='⏸ 暫停';}
  else if(!p&&playing){playing=false;stopVoice();pauseTimers();remain=Math.max(0,stepDur-(performance.now()-stepStart));$('bPlay').textContent='▶ 播放';}}
$('bPlay').addEventListener('click',()=>{if(ended){playing=true;$('bPlay').textContent='⏸ 暫停';goto(0,0);return;}setPlaying(!playing);});
$('bStart').addEventListener('click',()=>{setPlaying(true);});
['chips','bNext','bPrev','bNextScene','bPrevScene'].forEach(id=>$(id).addEventListener('click',()=>{$('bStart').hidden=true;}));
function fwd(){if(stepI+1<scenes[cur].steps.length)goto(cur,stepI+1);else advance();}
$('bNext').addEventListener('click',fwd);
$('bPrev').addEventListener('click',back);
$('bNextScene').addEventListener('click',()=>{if(cur+1<scenes.length)goto(cur+1,0);});
$('bPrevScene').addEventListener('click',()=>{goto(stepI>0?cur:Math.max(0,cur-1),0);});
function restartSentence(){if(!playing)return;stepDur=durOf(scenes[cur].steps[stepI][0]);remain=stepDur;stepStart=performance.now();startClock();}
$('speedSel').addEventListener('change',e=>{speed=parseFloat(e.target.value)||1;if(curAudio)curAudio.playbackRate=speed;restartSentence();});
$('voiceSel').addEventListener('change',()=>{if(voiceOn)restartSentence();});
$('bVoice').addEventListener('click',()=>{voiceOn=!voiceOn;$('bVoice').textContent=voiceOn?'🔊 語音：開':'🔇 語音：關';$('bVoice').classList.toggle('off',!voiceOn);stopVoice();restartSentence();});
document.addEventListener('keydown',e=>{if(e.target&&/^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName))return;if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
  if(e.key===' '){e.preventDefault();$('bPlay').click();}else if(e.key==='ArrowRight'){fwd();}else if(e.key==='ArrowLeft'){back();}else if(e.key==='f'||e.key==='F'){$('bFull').click();}});
(function tick(){const f=playing?(performance.now()-stepStart)/stepDur:(stepDur-remain)/stepDur;$('barfill').style.width=Math.max(0,Math.min(1,f))*100+'%';requestAnimationFrame(tick);})();
/* ---------- 深連結：#s5 或 #s5-3 直接跳到第 5 段第 3 句 ---------- */
function parseHash(){const m=/^#s(\d+)(?:-(\d+))?/.exec(location.hash||'');if(!m)return null;
  const sc=Math.min(scenes.length,Math.max(1,+m[1]))-1;const st=Math.max(0,Math.min(scenes[sc].steps.length-1,(+(m[2]||1))-1));return [sc,st];}
const EMBED=(()=>{try{return window.self!==window.top;}catch(e){return true;}})()||/embed/.test(location.hash);
if(EMBED)document.documentElement.classList.add('embed');
window.addEventListener('hashchange',()=>{const h=parseHash();if(h&&(h[0]!==cur||h[1]!==stepI))goto(h[0],h[1]);});
window.addEventListener('message',e=>{const d=e.data||{};
  if(d.type==='anim:goto'){const sc=Math.max(0,Math.min(scenes.length-1,(d.scene||1)-1));const st=Math.max(0,Math.min(scenes[sc].steps.length-1,(d.step||1)-1));goto(sc,st);if(d.play)setPlaying(true);}
  else if(d.type==='anim:pause')setPlaying(false);});
/* ---------- 放在小港網站上：雲端語音＋問小港 ---------- */
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function jumpLabel(id,sc,st){if(id!==ANIM_ID)return `▶ 另一支動畫：第 ${sc} 段`;const S=scenes[sc-1];return S?`▶ 跳到第 ${sc} 段${st?'・第 '+st+' 句':''}：${S.title}`:null;}
function renderAnswer(text){const box=document.createElement('div');box.className='askmsg bot';
  const jumps=[];const body=String(text).replace(/\[\[anim:([\w-]+):(\d+)(?:-(\d+))?\]\]/g,(m,id,sc,st)=>{jumps.push([id,+sc,st?+st:0]);return '';}).replace(/^\s*[*＊•-]\s*$/gm,'').replace(/^\s*(▶\s*)?看動畫[：:]\s*$/gm,'').replace(/\n{3,}/g,'\n\n').trim();
  box.innerHTML=esc(body).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^\s*\*\s+/gm,'• ');
  jumps.forEach(([id,sc,st])=>{const lab=jumpLabel(id,sc,st);if(!lab)return;const b=document.createElement('button');b.type='button';b.className='askjump';b.textContent=lab;
    b.addEventListener('click',()=>{if(id===ANIM_ID){$('bStart').hidden=true;goto(sc-1,Math.max(0,Math.min(scenes[sc-1].steps.length-1,(st||1)-1)));}else location.href=`../${id}/index.html#s${sc}-${st||1}`;});box.appendChild(b);});
  return box;}
async function ask(q){const log=$('askLog');const me=document.createElement('div');me.className='askmsg me';me.textContent=q;log.appendChild(me);
  const wait=document.createElement('div');wait.className='askmsg bot wait';wait.textContent='小港思考中…';log.appendChild(wait);log.scrollTop=log.scrollHeight;
  try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,anim:ANIM_ID})});
    const j=await r.json();wait.remove();if(!r.ok)throw new Error(j.message||('HTTP '+r.status));log.appendChild(renderAnswer(j.answer||''));}
  catch(e){wait.textContent='這一題沒有問成功：'+(e.message||e)+'。請稍後再試。';wait.classList.remove('wait');}
  log.scrollTop=log.scrollHeight;}
function openAsk(open){const d=$('askDrawer');d.classList.toggle('open',open);d.setAttribute('aria-hidden',open?'false':'true');if(open){setPlaying(false);setTimeout(()=>$('askInput').focus(),300);}}
$('askClose').addEventListener('click',()=>openAsk(false));
$('askForm').addEventListener('submit',e=>{e.preventDefault();const q=$('askInput').value.trim();if(!q)return;$('askInput').value='';ask(q);});
const TIPS=(window.__askTips||[]);TIPS.forEach(t=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.addEventListener('click',()=>ask(t));$('askTips').appendChild(b);});
fetch('/api/config',{headers:{Accept:'application/json'}}).then(r=>r.ok?r.json():null).then(j=>{if(!j)throw 0;
  CLOUD=true;const sel=$('voiceSel');addCloudOptions(sel);sel.value=sel.options[0].value;voiceOn=true;$('bVoice').disabled=false;$('bVoice').textContent='🔊 語音：開';$('voiceNote').hidden=true;
  if(j.live&&!EMBED){const b=$('bAsk');b.hidden=false;b.addEventListener('click',()=>openAsk(!$('askDrawer').classList.contains('open')));}
}).catch(()=>{if(ASK_URL&&!EMBED){const b=$('bAsk');const a=document.createElement('a');a.className='askbtn';a.href=ASK_URL;a.target='_blank';a.rel='noopener';a.textContent='💬 問小港（另開網頁）';a.style.textDecoration='none';b.replaceWith(a);}});
playing=false;{const h0=parseHash();goto(h0?h0[0]:0,h0?h0[1]:0);}
})();
</script>
