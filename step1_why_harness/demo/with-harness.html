<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>防災志工名單</title>
<style>
  /* ============================================================
     Design Token（取自 CODE-RULES-ui-本專案 / design-token.css）
     禁止硬編碼 hex/px，一律引用以下語意變數
     ============================================================ */
  :root {
    /* 品牌色 —— 防災紅 */
    --ui-sys-color-primary:            #C8232C;
    --ui-sys-color-primary-hover:      #A01D24;
    --ui-sys-color-primary-container:  #FFF0F0;
    --ui-sys-color-on-primary:         #FFFFFF;
    --ui-sys-color-on-primary-container:#6B0C10;
    /* 表面 / 文字 */
    --ui-sys-color-surface:            #FFFFFF;
    --ui-sys-color-surface-page:       #F5F6F8;
    --ui-sys-color-surface-variant:    #FAFAFA;
    --ui-sys-color-on-surface:         #0A0A0A;
    --ui-sys-color-on-surface-variant: #404040;
    --ui-sys-color-outline:            #737373;
    --ui-sys-color-outline-variant:    #E5E5E5;
    /* 語意色 */
    --ui-sys-color-error:              #FB2C36;
    --ui-sys-color-error-container:    #FEF2F2;
    --ui-sys-color-success:            #00C16A;
    --ui-sys-color-success-container:  #EFFDF5;
    /* 間距 */
    --sp-xs: 4px;
    --sp-sm: 8px;
    --sp-md: 16px;
    --sp-lg: 24px;
    --sp-xl: 40px;
    /* 圓角 */
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 16px;
    /* 字級 */
    --fs-title: 24px;
    --fs-label: 14px;
    --fs-body:  16px;
    --fs-helper: 12px;
    /* 陰影 */
    --elevation-card: 0 4px 8px rgba(0, 0, 0, 0.08);
    --elevation-modal: 0 20px 60px rgba(0, 0, 0, 0.18);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: var(--sp-lg);
    font-family: "Noto Sans TC", system-ui, sans-serif;
    font-size: var(--fs-body);
    color: var(--ui-sys-color-on-surface);
    background: var(--ui-sys-color-surface-page);
    line-height: 1.6;
  }

  .page { max-width: 720px; margin: 0 auto; }

  h1 {
    font-size: var(--fs-title);
    font-weight: 700;
    margin: 0 0 var(--sp-lg);
    padding-bottom: var(--sp-sm);
    border-bottom: 2px solid var(--ui-sys-color-primary);
  }

  .card {
    background: var(--ui-sys-color-surface);
    border: 1px solid var(--ui-sys-color-outline-variant);
    border-radius: var(--radius-lg);
    padding: var(--sp-lg);
    box-shadow: var(--elevation-card);
    margin-bottom: var(--sp-lg);
  }

  /* 表單 —— Label 在上、必填標星、欄位級錯誤 */
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: var(--sp-md);
    align-items: start;
  }

  .field { display: flex; flex-direction: column; gap: var(--sp-xs); }

  .field label {
    font-size: var(--fs-label);
    font-weight: 500;
    color: var(--ui-sys-color-on-surface-variant);
  }

  .required { color: var(--ui-sys-color-primary); margin-left: 2px; }

  .field input,
  .field select {
    font: inherit;
    font-size: var(--fs-body);
    padding: var(--sp-sm) var(--sp-md);
    border: 1px solid var(--ui-sys-color-outline-variant);
    border-radius: var(--radius-md);
    background: var(--ui-sys-color-surface-variant);
    color: var(--ui-sys-color-on-surface);
  }

  .field input:focus,
  .field select:focus {
    outline: none;
    background: var(--ui-sys-color-surface);
    border-color: var(--ui-sys-color-primary);
    box-shadow: 0 0 0 3px var(--ui-sys-color-primary-container);
  }

  .field.has-error input,
  .field.has-error select {
    border-color: var(--ui-sys-color-error);
    background: var(--ui-sys-color-error-container);
  }

  .error-text {
    font-size: var(--fs-helper);
    color: var(--ui-sys-color-error);
    min-height: 1em;
  }

  .actions { margin-top: var(--sp-md); }

  /* 按鈕 */
  .btn {
    font: inherit;
    font-weight: 600;
    padding: var(--sp-sm) var(--sp-lg);
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    cursor: pointer;
  }

  .btn-primary {
    background: var(--ui-sys-color-primary);
    color: var(--ui-sys-color-on-primary);
  }
  .btn-primary:hover { background: var(--ui-sys-color-primary-hover); }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }

  .btn-danger {
    background: transparent;
    color: var(--ui-sys-color-error);
    border-color: var(--ui-sys-color-error);
    padding: var(--sp-xs) var(--sp-md);
  }
  .btn-danger:hover { background: var(--ui-sys-color-error-container); }

  .btn-ghost {
    background: transparent;
    color: var(--ui-sys-color-on-surface-variant);
    border-color: var(--ui-sys-color-outline-variant);
  }
  .btn-ghost:hover { background: var(--ui-sys-color-surface-variant); }

  /* 表格 */
  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left;
    padding: var(--sp-sm) var(--sp-md);
    border-bottom: 1px solid var(--ui-sys-color-outline-variant);
  }
  th {
    font-size: var(--fs-label);
    font-weight: 600;
    color: var(--ui-sys-color-on-surface-variant);
    background: var(--ui-sys-color-surface-variant);
  }
  .empty {
    text-align: center;
    color: var(--ui-sys-color-outline);
    padding: var(--sp-xl) var(--sp-md);
  }
  .count {
    font-size: var(--fs-label);
    color: var(--ui-sys-color-on-surface-variant);
    margin-bottom: var(--sp-sm);
  }

  /* 血型徽章 */
  .badge {
    display: inline-block;
    padding: 2px var(--sp-sm);
    border-radius: var(--radius-sm);
    background: var(--ui-sys-color-primary-container);
    color: var(--ui-sys-color-on-primary-container);
    font-size: var(--fs-label);
    font-weight: 600;
  }

  /* 二次確認對話框 */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.48);
    display: none;
    align-items: center;
    justify-content: center;
    padding: var(--sp-md);
  }
  .overlay.open { display: flex; }
  .dialog {
    background: var(--ui-sys-color-surface);
    border-radius: var(--radius-lg);
    padding: var(--sp-lg);
    max-width: 400px;
    width: 100%;
    box-shadow: var(--elevation-modal);
  }
  .dialog h2 { font-size: 20px; margin: 0 0 var(--sp-sm); }
  .dialog p { margin: 0 0 var(--sp-lg); color: var(--ui-sys-color-on-surface-variant); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: var(--sp-sm); }

  /* 手機 */
  @media (max-width: 520px) {
    body { padding: var(--sp-md); }
    .form-grid { grid-template-columns: 1fr; }
    th:nth-child(2), td:nth-child(2) { display: none; } /* 窄螢幕先收起電話欄 */
  }
</style>
</head>
<body>
<div class="page">
  <h1>防災志工名單</h1>

  <!-- 新增表單 -->
  <div class="card">
    <form id="volunteer-form" novalidate>
      <div class="form-grid">
        <div class="field" id="field-name">
          <label for="input-name">姓名<span class="required">*</span></label>
          <input id="input-name" type="text" autocomplete="off" placeholder="請輸入姓名">
          <span class="error-text" id="error-name"></span>
        </div>
        <div class="field" id="field-phone">
          <label for="input-phone">電話<span class="required">*</span></label>
          <input id="input-phone" type="tel" autocomplete="off" placeholder="09 開頭共 10 碼">
          <span class="error-text" id="error-phone"></span>
        </div>
        <div class="field" id="field-blood">
          <label for="input-blood">血型<span class="required">*</span></label>
          <select id="input-blood">
            <option value="">請選擇</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="AB">AB</option>
            <option value="O">O</option>
          </select>
          <span class="error-text" id="error-blood"></span>
        </div>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary" id="submit-btn">新增志工</button>
      </div>
    </form>
  </div>

  <!-- 名單 -->
  <div class="card">
    <div class="count" id="count-text"></div>
    <table>
      <thead>
        <tr>
          <th>姓名</th>
          <th>電話</th>
          <th>血型</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<!-- 刪除二次確認 -->
<div class="overlay" id="confirm-overlay">
  <div class="dialog" role="alertdialog" aria-modal="true">
    <h2>刪除志工</h2>
    <p id="confirm-message"></p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-ghost" id="cancel-delete">取消</button>
      <button type="button" class="btn btn-danger" id="confirm-delete">確認刪除</button>
    </div>
  </div>
</div>

<script>
  "use strict";

  // 具名常數 —— 台灣手機格式（09 開頭共 10 碼）
  const PHONE_PATTERN = /^09\d{8}$/;
  const BLOOD_TYPES = ["A", "B", "AB", "O"];

  // 記憶體資料層（種子資料）
  let volunteers = [
    { name: "王小明", phone: "0912345678", blood: "O" },
    { name: "陳美麗", phone: "0987654321", blood: "A" }
  ];

  let pendingDeleteIndex = null;

  // DOM 參照
  const form = document.getElementById("volunteer-form");
  const submitBtn = document.getElementById("submit-btn");
  const tableBody = document.getElementById("table-body");
  const countText = document.getElementById("count-text");
  const overlay = document.getElementById("confirm-overlay");
  const confirmMessage = document.getElementById("confirm-message");

  const fields = {
    name: { input: document.getElementById("input-name"), wrap: document.getElementById("field-name"), error: document.getElementById("error-name") },
    phone: { input: document.getElementById("input-phone"), wrap: document.getElementById("field-phone"), error: document.getElementById("error-phone") },
    blood: { input: document.getElementById("input-blood"), wrap: document.getElementById("field-blood"), error: document.getElementById("error-blood") }
  };

  // 純函式驗證：回傳各欄位錯誤訊息（無錯則為空字串）
  function validate(form) {
    const errors = { name: "", phone: "", blood: "" };
    if (!form.name) {
      errors.name = "請輸入姓名";
    }
    if (!form.phone) {
      errors.phone = "請輸入電話";
    } else if (!PHONE_PATTERN.test(form.phone)) {
      errors.phone = "電話格式錯誤（09 開頭共 10 碼）";
    }
    if (!BLOOD_TYPES.includes(form.blood)) {
      errors.blood = "請選擇血型";
    }
    return errors;
  }

  function showErrors(errors) {
    Object.keys(fields).forEach(function (key) {
      const message = errors[key];
      fields[key].error.textContent = message;
      fields[key].wrap.classList.toggle("has-error", Boolean(message));
    });
  }

  function hasError(errors) {
    return Object.keys(errors).some(function (key) { return errors[key]; });
  }

  function renderTable() {
    countText.textContent = "目前共 " + volunteers.length + " 位志工";
    if (volunteers.length === 0) {
      tableBody.innerHTML = '<tr><td class="empty" colspan="4">尚無志工資料</td></tr>';
      return;
    }
    tableBody.innerHTML = volunteers.map(function (v, index) {
      return "<tr>" +
        "<td>" + escapeHtml(v.name) + "</td>" +
        "<td>" + escapeHtml(v.phone) + "</td>" +
        '<td><span class="badge">' + escapeHtml(v.blood) + "</span></td>" +
        '<td><button type="button" class="btn btn-danger" data-index="' + index + '">刪除</button></td>' +
        "</tr>";
    }).join("");
  }

  // 防止使用者輸入內容破壞表格結構
  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function handleSubmit(event) {
    event.preventDefault();
    const draft = {
      name: fields.name.input.value.trim(),
      phone: fields.phone.input.value.trim(),
      blood: fields.blood.input.value
    };
    const errors = validate(draft);
    showErrors(errors);
    if (hasError(errors)) {
      return;
    }
    submitBtn.disabled = true; // 送出防重複
    volunteers.push(draft);
    form.reset();
    renderTable();
    submitBtn.disabled = false;
  }

  function openConfirm(index) {
    pendingDeleteIndex = index;
    confirmMessage.textContent = "確定要刪除「" + volunteers[index].name + "」嗎？此動作無法復原。";
    overlay.classList.add("open");
  }

  function closeConfirm() {
    pendingDeleteIndex = null;
    overlay.classList.remove("open");
  }

  function confirmDelete() {
    if (pendingDeleteIndex !== null) {
      volunteers.splice(pendingDeleteIndex, 1);
      renderTable();
    }
    closeConfirm();
  }

  // 事件綁定
  form.addEventListener("submit", handleSubmit);
  tableBody.addEventListener("click", function (event) {
    const button = event.target.closest("button[data-index]");
    if (button) {
      openConfirm(Number(button.dataset.index));
    }
  });
  document.getElementById("cancel-delete").addEventListener("click", closeConfirm);
  document.getElementById("confirm-delete").addEventListener("click", confirmDelete);
  overlay.addEventListener("click", function (event) {
    if (event.target === overlay) {
      closeConfirm();
    }
  });

  renderTable();
</script>
</body>
</html>
